<style>
/* ---------------------------------------------------------------- token */
:root{
  --tufo:#E8DDC8; --carta:#F6F0E2; --ink:#1F1811; --ink-soft:#6B5E4C;
  --granata:#8E1B2E; --oro:#E0A93B; --verde:#14663F; --linea:#CFC0A3;
  --ombra:0 .6rem 1.6rem rgba(46,32,16,.22);
  --ground:var(--tufo); --card:var(--carta);
  --display:'Archivo Black',Impact,Haettenschweiler,sans-serif;
  --body:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --tufo:#17120C; --carta:#221A12; --ink:#F3E8D5; --ink-soft:#A3917A;
    --granata:#C4304A; --oro:#F0C24B; --verde:#2E9463; --linea:#3A2E22;
    --ombra:0 .6rem 1.8rem rgba(0,0,0,.55);
    --ground:var(--tufo); --card:var(--carta);
  }
}
:root[data-theme="dark"]{
  --tufo:#17120C; --carta:#221A12; --ink:#F3E8D5; --ink-soft:#A3917A;
  --granata:#C4304A; --oro:#F0C24B; --verde:#2E9463; --linea:#3A2E22;
  --ombra:0 .6rem 1.8rem rgba(0,0,0,.55);
  --ground:var(--tufo); --card:var(--carta);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);
  font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background:radial-gradient(circle at 18% 12%,rgba(224,169,59,.16),transparent 45%),
             radial-gradient(circle at 84% 78%,rgba(20,102,63,.14),transparent 48%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--oro);outline-offset:3px;border-radius:4px}

.app{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:0 16px 40px;
  min-height:100%;display:flex;flex-direction:column}

/* ---------------------------------------------------------------- rail */
.rail{position:sticky;top:0;z-index:20;padding:12px 0 10px;background:var(--ground);
  border-bottom:1px solid var(--linea)}
.rail-top{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.rail-top h1{font-family:var(--display);font-size:15px;letter-spacing:.06em;margin:0;flex:1;
  text-transform:uppercase}
.rail-top .cnt{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:var(--ink-soft)}
.spk{width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex:none;
  border-radius:50%;color:var(--ink-soft);transition:color .2s,background .2s}
.spk[aria-pressed="true"]{color:var(--granata);background:rgba(142,27,46,.10)}
.spk svg{width:18px;height:18px;fill:currentColor}
/* ---------------------------------------------------------------- barre
   Tre gruppi invece di una barra unica: le due squadre in gara + lo staff.
   La tua squadra e' evidenziata. */
.bars{display:flex;flex-direction:column;gap:4px}
.bar{display:flex;align-items:center;gap:7px;font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-soft)}
.bar span{width:58px;flex:none}
.bar i{flex:1;display:flex;gap:2px}
.bar b{flex:1;height:5px;border-radius:99px;background:var(--linea);transition:background .35s}
.bar b.on{background:var(--bc)}
.bar em{width:28px;text-align:right;font-style:normal;font-variant-numeric:tabular-nums;font-weight:600}


/* ---------------------------------------------------------------- uscita */
.tag.rara{background:linear-gradient(100deg,#E0A93B,#FFF0B8 45%,#E0A93B);color:#3A2A05}
.tag.team{background:var(--ink);color:var(--carta)}
.reveal .stage--wide{width:min(90vw,340px)}
@keyframes glow{0%,100%{box-shadow:0 2px 6px rgba(46,32,16,.25)}
                50%{box-shadow:0 0 24px rgba(224,169,59,.85)}}
.reveal--rara .stage .fig{animation:pop .5s cubic-bezier(.2,1.4,.4,1),
  glow 1.9s ease-in-out .5s infinite}
.dupnote{color:var(--ink-soft);font-size:12px;max-width:230px;text-align:center;
  margin:0;line-height:1.4}

/* ---------------------------------------------------------------- album */
.page-n{margin-left:auto;font-family:var(--display);font-size:15px;color:var(--pc);opacity:.55}

/* --- premiazione: si guarda, non si compila --- */
.premi{display:flex;flex-direction:column;gap:9px}
.premio{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:7px;
  padding:12px 14px;border:1px solid var(--linea);border-radius:4px;background:var(--carta);
  text-align:left}
.premio--dato{border-color:var(--oro);box-shadow:inset 3px 0 0 var(--oro)}
.pr-l{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-soft);
  line-height:1.3}
.pr-v{display:flex;align-items:center;gap:9px;width:100%}
.pr-v b{font-family:var(--display);font-size:15px;text-transform:uppercase;line-height:1.1}

.volto{width:40px;height:40px;border-radius:50%;overflow:hidden;display:block;flex:none;
  background:var(--linea);box-shadow:0 0 0 2px var(--carta),0 0 0 3px var(--linea)}
.volto img{width:100%;height:100%;object-fit:cover;object-position:50% 10%;display:block}
.volto--crest{display:flex;align-items:center;justify-content:center;background:var(--pc)}
.volto--crest svg{width:74%;height:auto}

.ris{display:flex;align-items:center;gap:8px;flex:none}
.ris em{font-family:var(--display);font-size:38px;font-style:normal;line-height:1;
  font-variant-numeric:tabular-nums}
.ris i{font-family:var(--display);font-size:22px;font-style:normal;color:var(--ink-soft)}
.esito{font-family:var(--display);font-size:14px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--pc);margin:0 0 20px;line-height:1.3}
.frase-out{font-size:16px;line-height:1.5;color:var(--ink);margin:20px 6px 0;
  font-style:italic;text-wrap:balance}

/* comparsa a scaglioni */
.ap{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}
.ap.on{opacity:1;transform:none}
.bar--piena em{color:var(--bc);font-weight:700}

/* ---------------------------------------------------------------- derby */
.derby{text-align:center;padding-bottom:10px}
.derby-t{font-family:var(--display);font-size:clamp(28px,9vw,38px);margin:4px 0 0;
  text-transform:uppercase;line-height:1}
.derby-s{color:var(--ink-soft);font-size:13px;margin-top:9px;line-height:1.45}
.score{display:flex;align-items:center;justify-content:center;gap:10px;margin:24px 0 22px}
.score .sq{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px}
.score .sq svg{width:56px;height:auto}
.score .sq span{font-size:9px;letter-spacing:.1em;font-weight:700;color:var(--pc);
  text-transform:uppercase;line-height:1.2}
/* --- premi: si assegnano toccando, non scrivendo --- */
.premi{display:flex;flex-direction:column;gap:9px}
.premio{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:7px;
  padding:12px 14px;border:1px solid var(--linea);border-radius:4px;background:var(--carta);
  text-align:left;transition:border-color .2s,transform .14s}
.premio:active{transform:scale(.985)}
.premio--dato{border-color:var(--oro);box-shadow:inset 3px 0 0 var(--oro)}
.pr-l{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-soft);
  line-height:1.3}
.pr-v{display:flex;align-items:center;gap:9px;width:100%}
.pr-v i{font-style:normal;font-size:14px;color:var(--ink-soft);opacity:.75}
.pr-v b{font-family:var(--display);font-size:15px;text-transform:uppercase;line-height:1.1}
.premio--firma{margin-top:14px;border-style:dashed}

.volto{width:40px;height:40px;border-radius:50%;overflow:hidden;display:block;flex:none;
  background:var(--linea);box-shadow:0 0 0 2px var(--carta),0 0 0 3px var(--linea)}
.volto img{width:100%;height:100%;object-fit:cover;object-position:50% 10%;display:block}
.volto--crest{display:flex;align-items:center;justify-content:center;background:var(--pc)}
.volto--crest svg{width:74%;height:auto}


.forma{display:flex;flex-direction:column;gap:13px;margin-top:22px}
.forma figure{margin:0}
.copybox{width:100%;height:150px;margin-top:10px;font:inherit;font-size:12px;line-height:1.5;
  padding:10px;border:1px solid var(--linea);border-radius:3px;background:var(--carta);
  color:var(--ink);resize:vertical}

/* ---------------------------------------------------------------- scene */
.scene{flex:1;display:flex;flex-direction:column;padding-top:18px}
.hidden{display:none!important}

/* copertina */
.cover{text-align:center;padding-top:12px}
.cover .kick{font-size:12px;letter-spacing:.42em;color:var(--ink-soft);text-transform:uppercase}
.cover h2{font-family:var(--display);font-size:clamp(34px,11vw,48px);line-height:.92;margin:14px 0 0;
  text-wrap:balance;text-transform:uppercase}
.cover .sub{color:var(--ink-soft);letter-spacing:.2em;font-size:13px;margin-top:10px;text-transform:uppercase}
.duel{display:flex;align-items:center;justify-content:center;gap:18px;margin:26px 0 6px}
.duel svg{width:88px;height:auto;filter:drop-shadow(0 6px 12px rgba(0,0,0,.3))}
.duel .x{font-family:var(--display);font-size:22px;color:var(--ink-soft)}
.names{display:flex;justify-content:center;gap:18px;font-size:12px;letter-spacing:.12em;
  font-weight:700;text-transform:uppercase}
.names span{width:88px}
.names .e{color:var(--granata)} .names .x{color:var(--verde)}

.btn{display:block;width:100%;margin-top:26px;padding:16px;border-radius:2px;
  background:var(--granata);color:#FFF6E6;font-family:var(--display);font-size:17px;
  letter-spacing:.08em;text-transform:uppercase;box-shadow:var(--ombra);
  transition:transform .12s,filter .2s}
.btn:active{transform:translateY(2px)}
.btn.ghost{background:none;color:var(--ink-soft);box-shadow:none;font-family:var(--body);
  font-weight:600;letter-spacing:.14em;font-size:14px;margin-top:14px;padding:10px}
.btn[disabled]{filter:grayscale(.7);opacity:.5;pointer-events:none}

/* ---------------------------------------------------------------- bustina */
.packwrap{display:flex;flex-direction:column;align-items:center;gap:22px;padding-top:8px}
.pack{position:relative;width:min(74vw,270px);aspect-ratio:5/7;border-radius:4px;overflow:hidden;
  box-shadow:var(--ombra);transform-origin:50% 60%}
.pack .side{position:absolute;inset:0;
  background:linear-gradient(118deg,var(--granata) 0 48%,var(--oro) 48% 52%,var(--verde) 52% 100%)}
.pack .foil{position:absolute;inset:0;mix-blend-mode:screen;opacity:.55;
  background:repeating-linear-gradient(108deg,rgba(255,255,255,.42) 0 10px,rgba(255,0,140,.2) 10px 20px,
  rgba(0,220,255,.2) 20px 30px,rgba(255,240,0,.22) 30px 40px,rgba(255,255,255,0) 40px 74px);
  animation:foil 4.5s linear infinite}
@keyframes foil{to{transform:translateX(-74px)}}
.pack .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;color:#fff;text-align:center;padding:18px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.pack .lbl b{font-family:var(--display);font-size:24px;line-height:1;text-transform:uppercase}
.pack .lbl small{font-size:12px;letter-spacing:.3em;text-transform:uppercase;opacity:.9}
.pack .lbl .n{font-family:var(--display);font-size:44px;line-height:1}
.pack .zig{position:absolute;left:0;right:0;top:16px;height:8px;
  background:repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.35) 6px 12px)}
.pack.shake{animation:shake .45s ease-in-out}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
.pack.tear .side,.pack.tear .lbl,.pack.tear .foil,.pack.tear .zig{animation:tear .5s ease-in forwards}
@keyframes tear{to{transform:translateY(-130%) rotate(-14deg);opacity:0}}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:60}
.flash.go{animation:fl .5s ease-out}
@keyframes fl{0%{opacity:.85}100%{opacity:0}}
.hint{color:var(--ink-soft);font-size:13px;letter-spacing:.16em;text-transform:uppercase}

/* ---------------------------------------------------------------- figurina
   Misure in cqw (% della larghezza della figurina): le proporzioni restano
   identiche a quelle della versione stampata, dal francobollo al pieno schermo.
   --k dimezza la scala sulle figurine doppie, larghe il doppio.            */
.fig{position:relative;width:100%;aspect-ratio:5/7;background:var(--carta);padding:3%;
  border-radius:2px;box-shadow:0 2px 6px rgba(46,32,16,.25);
  container-type:inline-size;--k:1}
.fig--wide{aspect-ratio:10/7;--k:.5}
.fig-in{position:relative;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;
  background:var(--c1);border:calc(1.2cqw*var(--k)) solid var(--c2)}
.fig-ph{flex:1;position:relative;overflow:hidden;background:var(--c3)}
.fig-ph img{width:100%;height:100%;object-fit:cover;display:block}
.fig-ph.crest{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4cqw;
  background:radial-gradient(circle at 50% 38%,var(--c1),var(--c3))}
.fig-ph.crest svg{width:52%;height:auto}
.fig-ph.crest i{font-style:normal;font-size:calc(5.4cqw*var(--k));letter-spacing:.18em;color:var(--c2)}
.band{background:var(--c1);border-top:calc(1.4cqw*var(--k)) solid var(--c2);color:var(--ink2);
  padding:calc(2.6cqw*var(--k)) calc(4cqw*var(--k)) calc(3.2cqw*var(--k))}
.band .nm{font-family:var(--display);font-size:calc(7.6cqw*var(--k));line-height:1.05;
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band .sb{font-size:calc(5.4cqw*var(--k));opacity:.85;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;margin-top:.6cqw}
.band .st{display:flex;align-items:center;gap:calc(2.4cqw*var(--k));font-size:calc(4.4cqw*var(--k));
  letter-spacing:.04em;margin-top:calc(1.2cqw*var(--k))}
.band .st u{text-decoration:none;width:calc(16cqw*var(--k));opacity:.85}
.band .st i{flex:1;height:calc(2.4cqw*var(--k));background:rgba(255,255,255,.2);display:block}
.band .st i b{display:block;height:100%;background:var(--c2)}
.band .st em{font-style:normal;width:calc(10cqw*var(--k));text-align:right;font-weight:600;
  font-variant-numeric:tabular-nums}
.fig .num{position:absolute;top:calc(3cqw*var(--k));right:calc(3cqw*var(--k));
  width:calc(14cqw*var(--k));height:calc(14cqw*var(--k));border-radius:50%;
  background:var(--c2);color:var(--c3);font-family:var(--display);font-size:calc(6.6cqw*var(--k));z-index:4;
  display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 .8cqw rgba(0,0,0,.25)}
.fig .mini{position:absolute;top:calc(2.6cqw*var(--k));left:calc(3.2cqw*var(--k));z-index:4;
  width:calc(13cqw*var(--k))}
.fig .mini svg{width:100%;height:auto;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.fig.holo{background:linear-gradient(135deg,var(--carta) 0 38%,#F6D98F 50%,var(--carta) 62%)}
.fig.holo .fig-ph::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
  mix-blend-mode:screen;opacity:.5;
  background:repeating-linear-gradient(var(--holo,112deg),rgba(255,255,255,.38) 0 4cqw,rgba(255,0,140,.18) 4cqw 8cqw,
  rgba(0,210,255,.18) 8cqw 12cqw,rgba(255,240,0,.2) 12cqw 16cqw,rgba(255,255,255,0) 16cqw 29cqw)}

/* ---------------------------------------------------------------- reveal */
.reveal{display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:4px}
.reveal .stage{width:min(72vw,262px)}
.reveal .stage .fig{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.5) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
.tag{font-family:var(--display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;
  padding:5px 12px;border-radius:99px}
.tag.new{background:var(--oro);color:#241a06}
.tag.dup{background:var(--linea);color:var(--ink-soft)}
.pips{display:flex;gap:6px}
.pips b{width:7px;height:7px;border-radius:50%;background:var(--linea)}
.pips b.on{background:var(--ink-soft)}

/* ---------------------------------------------------------------- album */
.pages{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:16px;
  margin:0 -16px;padding:0 16px 8px;scrollbar-width:none}
.pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:center}
.page-h{display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--pc);
  padding-bottom:8px;margin-bottom:14px}
.page-h svg{width:34px;height:auto;flex:none}
.page-h h3{font-family:var(--display);font-size:19px;margin:0;color:var(--pc);text-transform:uppercase;
  line-height:1.05}
.page-h .mt{font-size:10px;letter-spacing:.24em;color:var(--ink-soft);text-transform:uppercase}
/* minmax(0,1fr): senza, i nomi lunghi allargano le colonne oltre lo schermo */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cell{position:relative;min-width:0}
.fig-in,.band,.band .nm,.band .sb{min-width:0}
/* larghezza esplicita (non max-width): con container-type la larghezza
   intrinseca della figurina e' 0 e la cella centrata collasserebbe.
   66% = esattamente due colonne di figurine + il gap. */
.cell.wide{grid-column:span 3;width:66%;margin:4px auto 0}
.slot{width:100%;aspect-ratio:5/7;border:2px dashed var(--pc);border-radius:3px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;
  padding:0 4px 8px;text-align:center;opacity:.65;
  background:repeating-linear-gradient(45deg,rgba(0,0,0,.03) 0 6px,transparent 6px 12px)}
.slot .g{position:absolute;top:50%;left:50%;transform:translate(-50%,-58%);font-family:var(--display);
  font-size:44px;color:var(--pc);opacity:.16}
.slot .nm{font-family:var(--display);font-size:8.5px;color:var(--pc);text-transform:uppercase;
  position:relative;line-height:1.1}
.slot .sb{font-size:8px;color:var(--ink-soft);position:relative}
.cell.wide .slot{aspect-ratio:10/7}
.cell.wide .slot .g{font-size:54px}
.owned{cursor:pointer;transition:transform .18s}
.owned:active{transform:scale(.96)}
.dupbadge{position:absolute;bottom:-5px;right:-5px;z-index:5;background:var(--ink);color:var(--carta);
  font-size:9px;font-weight:700;letter-spacing:.08em;padding:2px 6px;border-radius:99px}
.swipe{text-align:center;color:var(--ink-soft);font-size:11px;letter-spacing:.2em;
  text-transform:uppercase;margin-top:14px}
.dots{display:flex;justify-content:center;gap:7px;margin-top:8px}
.dots b{width:7px;height:7px;border-radius:50%;background:var(--linea);transition:background .2s}
.dots b.on{background:var(--ink-soft)}

/* ---------------------------------------------------------------- lightbox */
.lb{position:fixed;inset:0;z-index:70;background:rgba(20,14,8,.9);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;
  backdrop-filter:blur(6px)}

{"n":11,"tipo":"player","sq":"extra","img":"05_brasile","nome":"MAGLIA BRASILE","sopra":"O'Rey","ruolo":"Centrocampista","stats":[86,84,88],"src":"05_brasile.jpg"},{"n":12,"tipo":"player","sq":"extra","img":"04_juveblu","nome":"MAGLIA JUVE 10","sopra":"Il Decimo","ruolo":"Fantasista","stats":[90,92,95],"special":true,"src":"04_juveblu.jpg"},{"n":13,"tipo":"staff","sq":"neutro","img":"11_mister","nome":"IL MISTER","sopra":"Panchina","ruolo":"Allenatore e Direttore Sportivo","src":"11_mister.jpg"},{"n":14,"tipo":"mascotte","sq":"neutro","img":"12_mascotte1","nome":"MASCOTTE 1","sopra":"Spider","ruolo":"Mascotte ufficiale","special":true,"src":"12_mascotte1.jpg"},{"n":15,"tipo":"mascotte","sq":"neutro","img":"13_mascotte2","nome":"MASCOTTE 2","sopra":"Il Sole","ruolo":"Mascotte ufficiale","special":true,"src":"13_mascotte2.jpg"},{"n":16,"tipo":"team","sq":"entro","img":"15_squadraB","nome":"LA SQUADRA","sopra":"Norba Entro Mura","ruolo":"Formazione tipo","special":true,"src":"15_squadraB.jpg"},{"n":17,"tipo":"team","sq":"extra","img":"14_squadraA","nome":"LA SQUADRA","sopra":"Norba Extra Mura","ruolo":"Formazione tipo","special":true,"src":"14_squadraA.jpg"}]};
const SQ = D.squadre, FIGS = D.figurine, byN = {};
FIGS.forEach(f => byN[f.n] = f);
const NEUTRO = {c1:"#1C2430",c2:"#D9B85C",c3:"#0B1119",cInk:"#FFF8E7"};
const col = sq => SQ[sq] || NEUTRO;

/* ------------------------------------------------------------- stemmi */

function ballSvg(c){

/* ------------------------------------------------------------- figurina */
function figHTML(f){
  const c = col(f.sq), LB = ["TIRO","FIATO","CUORE"];
  const style = `--c1:${c.c1};--c2:${c.c2};--c3:${c.c3};--ink2:${c.cInk||"#fff"}`;
  const body = f.tipo === "stemma"
    ? `<div class="fig-ph crest">${crest(f.sq)}<i>${SQ[f.sq].motto}</i></div>`
    : `<div class="fig-ph"><img src="${f.src}" alt="${f.nome}"
         style="object-position:50% ${f.tipo === "team" ? "8%" : "0%"}"></div>`;
  const nome = f.tipo === "stemma" ? SQ[f.sq].breve : f.nome;
  const sub  = f.tipo === "stemma" ? SQ[f.sq].motto : (f.sopra || "");
  const stats = (f.stats || []).map((v,i) =>
    `<div class="st"><u>${LB[i]}</u><i><b style="width:${v}%"></b></i><em>${v}</em></div>`).join("");
  const badge = f.sq === "neutro" ? ballSvg(NEUTRO.c2) : crest(f.sq);
  return `<div class="fig ${f.special ? "holo" : ""} ${f.tipo === "team" ? "fig--wide" : ""}" style="${style}">

    <div class="band"><div class="nm">${nome}</div>
      <div class="sb">${sub}${sub && f.ruolo ? " &middot; " : ""}${f.ruolo || ""}</div>${stats}

}

/* ------------------------------------------------- audio: musica + effetti
   Gli effetti sono sintetizzati qui con la Web Audio API: nessun file da
   scaricare e nessun ritardo. La musica e' un loop di 10,7 s incorporato.
   L'audio parte solo dopo un tocco: i browser bloccano il suono automatico. */
const MUSICA = "musica.mp3";
let AC = null, mus = null, sfxOut = null, soundOn = false, wanted = true;
try { wanted = localStorage.getItem("derbyAudio") !== "0"; } catch(e){}

const SPK_ON  = '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7l1.2 1.2a6.7 6.7 0 0 0 0-9.4l-1.2 1.2z"/></svg>';
const SPK_OFF = '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9.4 17.4 8l2.1 2.1L21.6 8 23 9.4l-2.1 2.1 2.1 2.1-1.4 1.4-2.1-2.1-2.1 2.1-1.4-1.4 2.1-2.1L16 9.4z"/></svg>';

function paintSpk(){
  const b = $("#spk"); if (!b) return;
  b.innerHTML = wanted ? SPK_ON : SPK_OFF;
  b.setAttribute("aria-pressed", wanted ? "true" : "false");
}
function fadeMusic(to){
  if (!mus) return;
  const step = (to - mus.volume) / 18; let i = 0;
  const id = setInterval(() => {
    mus.volume = Math.max(0, Math.min(1, mus.volume + step));
    if (++i >= 18) clearInterval(id);
  }, 40);
}
function audioStart(){
  if (AC || !wanted) { paintSpk(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ AC = null; return; }
  sfxOut = AC.createGain(); sfxOut.gain.value = .85; sfxOut.connect(AC.destination);
  if (MUSICA){
    mus = new Audio(MUSICA); mus.loop = true; mus.volume = 0;
    mus.play().then(() => fadeMusic(.28)).catch(() => {});
  }
  soundOn = true; paintSpk();
}
function toggleSound(){
  wanted = !wanted;
  try { localStorage.setItem("derbyAudio", wanted ? "1" : "0"); } catch(e){}
  if (wanted){
    if (!AC) audioStart();
    else { soundOn = true; if (mus){ mus.play().catch(() => {}); fadeMusic(.28); } }
  } else {
    soundOn = false;
    if (mus){ fadeMusic(0); setTimeout(() => { try { mus.pause(); } catch(e){} }, 800); }
  }
  paintSpk();
}

function noiseBuf(dur){
  const n = Math.max(1, Math.floor(AC.sampleRate * dur));
  const b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return b;
}
function shape(g, t0, peak, dur, atk){
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(peak, t0 + atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
}
function noiseHit(t0, peak, dur, f0, f1, q, type){
  const s = AC.createBufferSource(); s.buffer = noiseBuf(dur + .05);
  const f = AC.createBiquadFilter(); f.type = type || "bandpass";
  f.frequency.setValueAtTime(f0, t0);
  f.frequency.exponentialRampToValueAtTime(Math.max(60, f1), t0 + dur);
  f.Q.value = q || 1;
  const g = AC.createGain(); shape(g, t0, peak, dur, .008);
  s.connect(f); f.connect(g); g.connect(sfxOut); s.start(t0); s.stop(t0 + dur + .05);
}
function toneHit(t0, peak, dur, f0, f1, type, cut){
  const o = AC.createOscillator(); o.type = type || "sine";
  o.frequency.setValueAtTime(f0, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t0 + dur);
  const g = AC.createGain(); shape(g, t0, peak, dur, .006);
  let last = o;
  if (cut){ const f = AC.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = cut;
            o.connect(f); last = f; }
  last.connect(g); g.connect(sfxOut); o.start(t0); o.stop(t0 + dur + .02);
}
function sfx(kind){
  if (!AC || !soundOn) return;
  const t = AC.currentTime + .01;
  switch (kind){
    case "rustle":  noiseHit(t, .18, .22, 2800, 1600, .9); break;
    case "tear":    noiseHit(t, .42, .50, 3800, 600, .7);
                    noiseHit(t + .02, .16, .30, 900, 300, 1.4); break;
    case "whoosh":  noiseHit(t, .16, .34, 600, 2400, 1.1);
                    noiseHit(t + .16, .12, .22, 2400, 700, 1.1); break;
    case "slap":    toneHit(t, .34, .16, 240, 70, "sine");
                    noiseHit(t, .12, .05, 3000, 1500, .8); break;
    case "sparkle": [1046.5, 1318.5, 1568, 2093].forEach((f, i) =>
                      toneHit(t + i * .055, .13, .45, f, f, "triangle")); break;
    case "dup":     toneHit(t, .26, .28, 150, 120, "sine", 420);
                    toneHit(t + .004, .18, .26, 153, 122, "sine", 420); break;
    case "page":    noiseHit(t, .09, .26, 1400, 400, .8); break;
    case "chime":   toneHit(t, .14, .70, 880, 880, "triangle");
                    toneHit(t + .04, .10, .80, 1320, 1320, "triangle"); break;
    case "fanfare": [293.66, 349.23, 440, 587.33].forEach((f, i) =>
                      toneHit(t + i * .10, .16, .85, f, f, "sawtooth", 2600));
                    noiseHit(t, .16, 1.5, 6000, 2000, .6, "highpass"); break;
  }
}

/* ------------------------------------------------------------- stato
   Una sola struttura salvata sul telefono: chi sei, la tua squadra,
   le figurine che hai, a che bustina sei arrivato e il tabellino del derby. */
const KEY = "derbyMura2";
let ST = { owned: {}, pack: 0, doppie: 0, albo: {} };
try {
  const r = JSON.parse(localStorage.getItem(KEY) || "null");
  if (r && typeof r === "object") ST = Object.assign(ST, r);
} catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch(e){} };

const have = n => (ST.owned[n] || 0) > 0;
const total = () => FIGS.filter(f => have(f.n)).length;
const completo = () => total() === FIGS.length;

const GRUPPI = [
  { sq: "entro", nome: SQ.entro.breve },
  { sq: "extra", nome: SQ.extra.breve },
  { sq: "neutro", nome: "Staff" }
].map(g => Object.assign(g, { ns: FIGS.filter(f => f.sq === g.sq).map(f => f.n) }));

function paintRail(){
  $("#cnt").textContent = total() + "/" + FIGS.length;
  $("#bars").innerHTML = GRUPPI.map(g => {
    const n = g.ns.filter(have).length;
    const seg = g.ns.map(x => '<b class="' + (have(x) ? "on" : "") + '"></b>').join("");
    return '<div class="bar' + (n === g.ns.length ? " bar--piena" : "") + '" style="--bc:' +
      col(g.sq).c1 + '"><span>' + g.nome + '</span><i>' + seg + '</i><em>' +
      n + "/" + g.ns.length + "</em></div>";
  }).join("");
}

/* ------------------------------------------------------------- bustine
   Ordine non casuale ma in crescendo: prima le figurine comuni, poi le
   speciali, e le due formazioni sempre in fondo. Cosi' l'ultima bustina
   e' la migliore e il finale te lo sei guadagnato. */
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }

const PACK = 4;

function buildQueue(){
  // solo quello che manca davvero: cosi' anche ricaricando la pagina il mazzo torna giusto
  const manca = FIGS.filter(f => !have(f.n));
  const comuni = shuffle(manca.filter(f => !f.special).map(f => f.n));
  const rare   = shuffle(manca.filter(f => f.special && f.tipo !== "team").map(f => f.n));
  const forma  = manca.filter(f => f.tipo === "team").map(f => f.n);
  const seq = comuni.concat(rare, forma);
  if (!seq.length) return [];
  // doppioni quanto basta a chiudere l'ultima bustina, pescati tra le comuni
  let dup = (PACK - (seq.length % PACK)) % PACK;
  if (!dup && seq.length === FIGS.length) dup = PACK - 1;
  while (dup-- > 0 && comuni.length){
    const n = comuni[Math.random() * comuni.length | 0];
    seq.splice(1 + (Math.random() * Math.max(1, comuni.length) | 0), 0, n);
  }
  const packs = [];
  for (let i = 0; i < seq.length; i += PACK) packs.push(seq.slice(i, i + PACK));
  return packs;
}
let packs = [];

/* ------------------------------------------------------------- 1. copertina
   Nessuna domanda all'ingresso: si apre e si gioca. */
function viewCover(){
  scene.onclick = null;
  scene.innerHTML = `<section class="cover">
    <div class="kick">Album ufficiale delle figurine</div>
    <h2>${D.titolo}</h2>
    <div class="sub">${D.sottotitolo} &middot; ${D.stagione}</div>
    <div class="duel">${crest("entro")}<span class="x">&times;</span>${crest("extra")}</div>
    <div class="names"><span class="e">${SQ.entro.nome}</span><span class="x">${SQ.extra.nome}</span></div>
    <button class="btn" id="go">Apri la prima bustina</button>
    <button class="btn ghost" id="skip">Guarda subito l'album</button></section>`;
  $("#go").onclick = () => { audioStart(); askTilt(); viewPack(); };
  $("#skip").onclick = () => { audioStart(); askTilt(); viewAlbum(); };
}

/* ------------------------------------------------------------- 3. bustina */
function viewPack(){
  if (ST.pack >= packs.length) return viewAlbum();
  scene.onclick = null;
  scene.innerHTML = `<section class="packwrap">
    <div class="pack" id="pack" role="button" tabindex="0" aria-label="Apri la bustina">
      <div class="side"></div><div class="foil"></div><div class="zig"></div>
      <div class="lbl"><small>Bustina</small><span class="n">${ST.pack + 1}<small>/${packs.length}</small></span>
        <b>Derby<br>delle Mura</b><small>${PACK} figurine</small></div>
    </div>
    <p class="hint">Tocca la bustina per aprirla</p></section>`;
  const p = $("#pack"), apri = () => {
    p.onclick = null; audioStart();
    p.classList.add("shake"); sfx("rustle");
    setTimeout(() => {
      p.classList.add("tear"); $("#flash").classList.add("go"); sfx("tear");
      setTimeout(() => {
        $("#flash").classList.remove("go");
        const l = packs[ST.pack]; ST.pack++; save(); viewReveal(l);
      }, reduce ? 10 : 420);
    }, reduce ? 10 : 420);
  };
  p.onclick = apri;
  p.onkeydown = e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); apri(); } };
}

/* ------------------------------------------------------------- 4. le esce */
const persona = f => f.tipo !== "stemma" && f.tipo !== "team";

function viewReveal(list){
  let i = 0, cur = null;

  const disegna = () => {
    const f = cur.f, nuova = cur.nuova;
    let cls = "tag new", txt = "Nuova!";
    if (!nuova){ cls = "tag dup"; txt = "Doppia"; }
    else if (f.tipo === "team"){ cls = "tag team"; txt = "Formazione!"; }
    else if (f.special){ cls = "tag rara"; txt = "Speciale!"; }

    scene.innerHTML = `<section class="reveal${f.special && nuova ? " reveal--rara" : ""}">
      <span class="${cls}">${txt}</span>
      <div class="stage${f.tipo === "team" ? " stage--wide" : ""}">${figHTML(f)}</div>
      ${!nuova ? '<p class="dupnote">Ce l\'avevi gi&agrave;. Nell\'album vale come scambio.</p>' : ""}
      <div class="pips">${list.map((_, k) => `<b class="${k <= i - 1 ? "on" : ""}"></b>`).join("")}</div>
      <p class="hint">Tocca per continuare</p></section>`;
  };

  const step = () => {
    if (i >= list.length){
      scene.onclick = null;
      return completo() ? viewDerby(true) : viewAlbum(true);
    }
    const f = byN[list[i]], nuova = !have(f.n);
    ST.owned[f.n] = (ST.owned[f.n] || 0) + 1;
    if (!nuova) ST.doppie++;
    save(); paintRail();
    sfx("whoosh");
    setTimeout(() => sfx(!nuova ? "dup" : (f.special ? "sparkle" : "slap")), 170);
    cur = { f: f, nuova: nuova }; i++; disegna();
  };
  scene.onclick = null; step();
  scene.onclick = step;
}

/* ------------------------------------------------------------- 5. album */
const PAGINE = [
  { sq: "entro", tit: SQ.entro.nome, mt: SQ.entro.motto },
  { sq: "extra", tit: SQ.extra.nome, mt: SQ.extra.motto },
  { sq: "neutro", tit: "Staff & Mascotte", mt: "Gli insostituibili" }
];

function cellHTML(f){
  const c = col(f.sq), wide = f.tipo === "team";
  if (have(f.n)){
    const extra = ST.owned[f.n] > 1 ? `<span class="dupbadge">x${ST.owned[f.n]}</span>` : "";
    return `<div class="cell ${wide ? "wide" : ""} owned" data-n="${f.n}">${figHTML(f)}${extra}</div>`;
  }
  const nome = f.tipo === "stemma" ? SQ[f.sq].breve : f.nome;
  return `<div class="cell ${wide ? "wide" : ""}" style="--pc:${c.c1}">
    <div class="slot"><span class="g">${f.n}</span>
    <span class="nm">${nome}</span><span class="sb">${f.sopra || ""}</span></div></div>`;
}

function viewAlbum(daBustina){
  scene.onclick = null;
  const pagine = PAGINE.map(p => {
    const fs = FIGS.filter(f => f.sq === p.sq);
    const badge = p.sq === "neutro" ? ballSvg("#1C2430") : crest(p.sq);
    const n = fs.filter(f => have(f.n)).length;
    return `<section class="page" style="--pc:${col(p.sq).c1}">
      <div class="page-h">${badge}<div><h3>${p.tit}</h3><div class="mt">${p.mt}</div></div>
      <div class="page-n">${n}/${fs.length}</div></div>
      <div class="grid">${fs.map(cellHTML).join("")}</div></section>`;
  }).join("");
  const restano = packs.length - ST.pack;
  const azione = restano > 0
    ? `<button class="btn" id="more">Apri un'altra bustina (${restano})</button>`
    : `<button class="btn" id="derby">Vai alla premiazione</button>`;
  scene.innerHTML = `<div class="pages" id="pages">${pagine}</div>
    <div class="dots" id="dots"></div>
    <p class="swipe">Scorri di lato per cambiare pagina</p>${azione}
    ${ST.doppie ? `<p class="swipe">Doppioni trovati: ${ST.doppie}</p>` : ""}`;
  const pg = $("#pages"), dots = $("#dots");
  dots.innerHTML = PAGINE.map((_, i) => `<b class="${i ? "" : "on"}"></b>`).join("");
  let lastPage = -1;
  pg.onscroll = () => {
    const i = Math.round(pg.scrollLeft / pg.clientWidth);
    if (i !== lastPage){ if (lastPage >= 0) sfx("page"); lastPage = i; }
    [...dots.children].forEach((d, k) => d.classList.toggle("on", k === i));
  };
  if ($("#more")) $("#more").onclick = viewPack;
  if ($("#derby")) $("#derby").onclick = () => viewDerby(false);
  pg.querySelectorAll(".owned").forEach(el => el.onclick = () => lightbox(byN[+el.dataset.n]));
  if (daBustina) window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
}

/* ------------------------------------------------------------- 6. premiazione
   Nessuno decide niente: risultato, premi e frase escono a sorte dall'album.
   Il sorteggio avviene una volta sola e resta quello, come un verdetto. */
const PREMI = [
  { k: "oro",    l: "Pallone d'oro del gioved&igrave;" },
  { k: "parata", l: "Miglior parata (o miglior papera)" },
  { k: "fiato",  l: "Premio Fiato Corto" },
  { k: "terzo",  l: "Premio Terzo Tempo &middot; miglior tavolata" }
];

const FRASI = [
  "Era fuorigioco, ma nel calcio a 5 non esiste.",
  "Il palo non conta come tiro in porta.",
  "Con il campo asciutto sarebbe finita diversamente.",
  "Si gioca meglio dopo, a tavola.",
  "L'arbitro eravamo noi, infatti non ha protestato nessuno. Molto.",
  "Un tempo perfetto. L'altro non pervenuto.",
  "La partita &egrave; finita quando &egrave; finita l'acqua.",
  "Nessuno ricorda il risultato, tutti ricordano quel gol.",
  "Venti minuti di discussione per un fallo di mano.",
  "Il pi&ugrave; giovane correva per due, il pi&ugrave; grande parlava per tre.",
  "Domani nessuno riuscir&agrave; a scendere le scale.",
  "Il portiere ha parato tutto, tranne quelli che sono entrati."
];

function volto(f){
  if (f.tipo === "stemma")
    return `<span class="volto volto--crest" style="--pc:${col(f.sq).c1}">${crest(f.sq)}</span>`;
  return `<span class="volto"><img src="${f.src}" alt=""></span>`;
}
const comeSiChiama = f => f.tipo === "stemma" ? SQ[f.sq].breve : (f.sopra || f.nome);

/* il sorteggio: una volta sola, poi resta */
function sorteggia(){
  if (ST.albo && ST.albo.fatto) return;
  const R = n => Math.floor(Math.random() * n);
  const giocatori = FIGS.filter(f => f.tipo === "player").map(f => f.n);
  const gente = FIGS.filter(persona).map(f => f.n);
  const usati = [];
  const pesca = pool => {
    const liberi = pool.filter(n => usati.indexOf(n) < 0);
    const da = liberi.length ? liberi : pool;
    const n = da[R(da.length)];
    usati.push(n);
    return n;
  };
  ST.albo = {
    fatto: 1,
    ga: 2 + R(7), gb: 2 + R(7),
    oro: pesca(giocatori), parata: pesca(gente),
    fiato: pesca(gente), terzo: pesca(gente),
    frase: FRASI[R(FRASI.length)]
  };
  save();
}

function viewDerby(festa){
  scene.onclick = null;
  sorteggia();
  const A = FIGS.find(f => f.tipo === "team" && f.sq === "entro");
  const B = FIGS.find(f => f.tipo === "team" && f.sq === "extra");
  const ga = ST.albo.ga, gb = ST.albo.gb;
  const esito = ga === gb ? "Pareggio, si rigioca gioved&igrave;"
              : "Vince " + (ga > gb ? SQ.entro.nome : SQ.extra.nome);

  scene.innerHTML = `<section class="derby">
    <h2 class="derby-t">La premiazione</h2>
    <p class="derby-s">Il verdetto del Derby delle Mura, uscito dall'album.</p>

    <div class="score ap" data-i="0">
      <div class="sq" style="--pc:${col("entro").c1}">${crest("entro")}<span>${SQ.entro.breve}</span></div>
      <div class="ris"><em>${ga}</em><i>&ndash;</i><em>${gb}</em></div>
      <div class="sq" style="--pc:${col("extra").c1}">${crest("extra")}<span>${SQ.extra.breve}</span></div>
    </div>
    <p class="esito ap" data-i="1" style="--pc:${col(ga === gb ? "neutro" : (ga > gb ? "entro" : "extra")).c1}">${esito}</p>

    <div class="premi">${PREMI.map((pr, k) => {
      const f = byN[ST.albo[pr.k]];
      return `<div class="premio premio--dato ap" data-i="${k + 2}">
        <span class="pr-l">${pr.l}</span>
        <span class="pr-v">${volto(f)}<b>${comeSiChiama(f)}</b></span></div>`;
    }).join("")}</div>

    <p class="frase-out ap" data-i="6">&ldquo;${ST.albo.frase}&rdquo;</p>

    <div class="forma ap" data-i="7">${[A, B].map(f => `<figure>${figHTML(f)}</figure>`).join("")}</div>
    <button class="btn" id="copia">Copia la premiazione per il gruppo</button>
    <button class="btn ghost" id="torna">Torna all'album</button>
    <button class="btn ghost" id="reset">Ricomincia da capo</button>
  </section>`;

  // rivelazione a scaglioni, come una premiazione vera
  const pezzi = [...scene.querySelectorAll(".ap")];
  if (reduce) pezzi.forEach(el => el.classList.add("on"));
  else pezzi.forEach((el, k) => setTimeout(() => {
    el.classList.add("on");
    if (k >= 2 && k <= 5) sfx("sparkle"); else if (k === 1) sfx("slap");
  }, 260 + k * 620));

  $("#copia").onclick = () => {
    const pulisci = t => t.replace(/&igrave;/g, "i").replace(/&egrave;/g, "e")
      .replace(/&ugrave;/g, "u").replace(/&agrave;/g, "a").replace(/&middot;/g, "-");
    const r = [
      D.titolo.toUpperCase() + " - " + D.sottotitolo + " " + D.stagione,
      SQ.entro.nome + "  " + ga + " - " + gb + "  " + SQ.extra.nome,
      pulisci(esito), ""
    ];
    PREMI.forEach(pr => r.push(pulisci(pr.l) + ": " + comeSiChiama(byN[ST.albo[pr.k]])));
    r.push("", '"' + pulisci(ST.albo.frase) + '"', "");
    r.push("Album completato: " + total() + "/" + FIGS.length);
    r.push(location.href.split("?")[0]);
    const testo = r.join("\n");
    const fatto = () => { $("#copia").textContent = "Copiato! Incollalo nel gruppo"; sfx("chime"); };
    const ripiego = t => {
      const ta = document.createElement("textarea");
      ta.className = "copybox"; ta.value = t; ta.readOnly = true;
      $("#copia").after(ta); ta.select();
    };
    if (navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(testo).then(fatto, () => ripiego(testo));
    else ripiego(testo);
  };
  $("#torna").onclick = () => viewAlbum();
  $("#reset").onclick = () => {
    ST = { owned: {}, pack: 0, doppie: 0, albo: {} };
    save(); packs = buildQueue(); ST.pack = 0; paintRail(); viewCover();
  };
  if (festa && !reduce) confetti();
  if (festa) sfx("fanfare");
}

/* ------------------------------------------------------------- lightbox */
let lbEl = null;
function lightbox(f){
  sfx("chime");
  lbEl = document.createElement("div");
  lbEl.className = "lb"; lbEl.setAttribute("role", "dialog");
  lbEl.innerHTML = `<div class="holder">${figHTML(f)}</div>
    <p class="cap">Inclina il telefono &middot; tocca per chiudere</p>`;
  lbEl.onclick = () => { lbEl.remove(); lbEl = null; };
  document.body.appendChild(lbEl);
}
function tilt(rx, ry){
  if (!lbEl) return;
  const c = lbEl.querySelector(".fig");
  c.style.setProperty("--rx", rx.toFixed(1) + "deg");
  c.style.setProperty("--ry", ry.toFixed(1) + "deg");
  c.style.setProperty("--holo", (112 + ry * 1.8).toFixed(0) + "deg");
}
addEventListener("deviceorientation", e => {
  if (e.beta == null) return;
  tilt(Math.max(-16, Math.min(16, (e.beta - 45) * .45)), Math.max(-16, Math.min(16, e.gamma * .45)));
});
addEventListener("pointermove", e => {
  if (!lbEl || e.pointerType === "touch") return;
  tilt((.5 - e.clientY / innerHeight) * 22, (e.clientX / innerWidth - .5) * 26);
});
function askTilt(){
  const DOE = window.DeviceOrientationEvent;
  if (DOE && typeof DOE.requestPermission === "function") DOE.requestPermission().catch(() => {});
}

/* ------------------------------------------------------------- coriandoli */
function confetti(){
  const cv = document.createElement("canvas"); cv.className = "conf";
  cv.width = innerWidth; cv.height = innerHeight; document.body.appendChild(cv);
  const g = cv.getContext("2d"), cols = ["#8E1B2E", "#14663F", "#E0A93B", "#F6F0E2"];
  const P = Array.from({ length: 110 }, () => ({
    x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .6,
    w: 5 + Math.random() * 6, h: 8 + Math.random() * 9,
    v: 2 + Math.random() * 3.4, a: Math.random() * 6.28, s: (Math.random() - .5) * .22,
    c: cols[Math.random() * cols.length | 0]
  }));
  let t = 0;
  (function loop(){
    g.clearRect(0, 0, cv.width, cv.height);
    P.forEach(p => {
      p.y += p.v; p.a += p.s; p.x += Math.sin(p.a) * 1.1;
      g.save(); g.translate(p.x, p.y); g.rotate(p.a);
      g.fillStyle = p.c; g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); g.restore();
    });
    if (++t < 260) requestAnimationFrame(loop); else cv.remove();
  })();
}

/* ------------------------------------------------------------- avvio */
paintRail(); paintSpk();
$("#spk").onclick = toggleSound;
packs = buildQueue(); ST.pack = 0; save();      // il mazzo si ricostruisce su cio' che manca
if (total() === 0) viewCover(); else viewAlbum();
</script>
